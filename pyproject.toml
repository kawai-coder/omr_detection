[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-omr"
version = "0.1.0"
description = "Template-aligned OMR + handwriting-assisted extraction for scanned questionnaires"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Survey OMR Contributors"}]
dependencies = [
  "pymupdf>=1.24.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "pillow>=10.0.0",
  "streamlit>=1.35.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7.0", "pytesseract>=0.3.10"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
survey-omr = "survey_omr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
