[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-omr"
version = "0.1.0"
description = "Template-aligned OMR extraction pipeline for scanned questionnaires"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Survey OMR Contributors"}]
dependencies = [
  "pymupdf",
  "opencv-python",
  "numpy",
  "pandas",
  "openpyxl",
  "pyyaml",
  "tqdm",
  "pillow",
  "streamlit",
  "rich",
]

[project.optional-dependencies]
ocr = ["paddleocr", "pytesseract"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
survey-omr = "survey_omr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
